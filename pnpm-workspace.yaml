# pnpm 10 以降、依存パッケージのビルドスクリプトは既定で実行されない。
# ネイティブバイナリを展開する必要があるものだけを明示的に許可する。
packages:
  - 'apps/*'
  - 'configs/*'
  - 'packages/*'
  - 'infra/*'
  - 'scripts/*'
  - 'docs/*'

onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true

catalog:
  '@types/node': '^26.6.6'
  '@types/react': '^19.3.0'
  '@types/react-dom': '^19.3.0'
  '@vitejs/plugin-react': '^6.3.0'
  'jsdom': '^29.0.0'
  'oxfmt': '0.78.0'
  'oxlint': '1.93.0'
  'react': '^19.3.1'
  'react-dom': '^19.3.1'
  'react-router': '^8.5.1'
  'tsx': '^4.23.15'
  'typescript': '^5.9.0'
  'vite': '^8.3.8'
  'vitest': '^4.0.0'
